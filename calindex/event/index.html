<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tap to review and add this event in Calindex.">
  <meta name="theme-color" content="#e6f5eb">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Calindex">
  <meta property="og:title" content="Calindex Event">
  <meta property="og:description" content="Tap to review and add this event in Calindex.">
  <meta property="og:url" content="https://matthewdglynn.github.io/calindex/event/">
  <meta property="og:image" content="https://matthewdglynn.github.io/calindex/assets/calindex-event-card.png">
  <meta property="og:image:secure_url" content="https://matthewdglynn.github.io/calindex/assets/calindex-event-card.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Calindex app icon on a soft green background">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Calindex Event">
  <meta name="twitter:description" content="Tap to review and add this event in Calindex.">
  <meta name="twitter:image" content="https://matthewdglynn.github.io/calindex/assets/calindex-event-card.png">
  <title>Calindex Event</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      color: #183528;
      background: radial-gradient(circle at top, #f8fffa 0, #e6f5eb 46%, #d7eadf 100%);
    }
    main {
      width: min(100%, 520px);
      padding: 42px 32px 34px;
      text-align: center;
      border: 1px solid rgba(44, 98, 70, .14);
      border-radius: 30px;
      background: rgba(255, 255, 255, .82);
      box-shadow: 0 24px 70px rgba(24, 74, 49, .14);
      backdrop-filter: blur(18px);
    }
    img { width: 112px; height: 112px; }
    h1 { margin: 20px 0 9px; font-size: 38px; letter-spacing: -1.4px; }
    p { margin: 0; font-size: 17px; line-height: 1.5; color: #587366; }
    .actions { display: grid; gap: 12px; margin-top: 28px; }
    .button {
      min-height: 50px;
      display: grid;
      place-items: center;
      padding: 12px 18px;
      border-radius: 15px;
      color: white;
      background: #2f7653;
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
    }
    .button.secondary { color: #2c6649; background: #e5f3e9; }
    .privacy { margin-top: 24px; font-size: 14px; }
    [hidden] { display: none; }
    @media (prefers-color-scheme: dark) {
      body { color: #eefaf2; background: radial-gradient(circle at top, #173729 0, #10271d 55%, #0c1c15 100%); }
      main { border-color: rgba(190, 239, 208, .14); background: rgba(19, 48, 35, .82); }
      p { color: #b8d0c0; }
      .button { background: #68ad83; color: #0c2518; }
      .button.secondary { color: #c5e8d1; background: #214a35; }
    }
  </style>
</head>
<body>
  <main>
    <img src="/calindex/assets/calindex-app-icon.png" alt="Calindex app icon">
    <h1>Calindex Event</h1>
    <p>Review the shared details before adding anything to your calendar.</p>
    <div class="actions">
      <a id="open-in-calindex" class="button" href="https://apps.apple.com/app/id6789342118" hidden>Open in Calindex</a>
      <a class="button secondary" href="https://apps.apple.com/app/id6789342118">Get Calindex</a>
    </div>
    <p class="privacy">The event stays inside this link. This page does not receive or store its details.</p>
  </main>
  <script>
    (() => {
      const payload = window.location.hash.slice(1);
      if (!/^[A-Za-z0-9_-]{1,174764}$/.test(payload)) return;

      const openButton = document.getElementById("open-in-calindex");
      openButton.href = `calindex://event-card/${payload}`;
      openButton.hidden = false;
    })();
  </script>
</body>
</html>
